name: Comunicador

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villanos:
        description: "Que villano envía el mensaje"
        required: true
        type: choice
        options:
          - Lex Lutor
          - Magneto
          - Joker
          - Brainiac
      mensaje:
        description: "Mesaje para el consejo"
        required:  true
        default: "La misión fue un éxito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica
          

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: El Agente llega a la fortaleza
        run: |
          echo "Inputs:"
          echo ""
          echo "Villano: ${{inputs.villanos}}"
          echo "Nivel: ${{inputs.prioridad}}"
          echo "Mensaje: ${{inputs.mensaje}}"
