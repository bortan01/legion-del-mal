name: Comunicador

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villanos:
        description: "Que villano envía el mensaje"
        required: true
        type: choice
        options:
          - Lex Lutor
          - Magneto
          - Joker
          - Brainiac
      mensaje:
        description: "Mesaje para el consejo"
        required:  true
        default: "La misión fue un éxito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica
          

jobs:
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
